name: Offline regression tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      matrix:
        shell: [sh, busybox]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install test tools
        run: sudo apt-get update && sudo apt-get install -y lua5.1 pcre2-utils busybox shellcheck
      - name: Check shell syntax
        run: |
          bash -n build.sh
          shellcheck --severity=error build.sh extract.sh files/common/usr/sbin/8311-firmware-upgrade.sh files/common/usr/sbin/8311-vlansd.sh files/common/usr/sbin/8311-support.sh files/common/usr/sbin/8311-rx_los.sh files/common/usr/sbin/fwenv_set files/common/usr/sbin/fwenv_get
      - name: Run isolated device and LuCI regressions
        env:
          TEST_SHELL: ${{ matrix.shell }}
          TEST_SHELL_ARGS: ${{ matrix.shell == 'busybox' && 'sh' || '' }}
        run: python3 -m unittest discover -s tests -v
      - name: Check PON status polling
        run: node tests/status_poll_smoke.cjs

  firefox:
    name: Firefox backup and form regression
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated browser test tools
        run: |
          npm install --prefix "$RUNNER_TEMP/8311-browser-tests" --no-package-lock playwright@1.62.1
          node "$RUNNER_TEMP/8311-browser-tests/node_modules/playwright/cli.js" install --with-deps firefox
      - name: Test backup download, restore and firmware forms in Firefox
        env:
          NODE_PATH: ${{ runner.temp }}/8311-browser-tests/node_modules
          BROWSER_ENGINE: firefox
        run: node tests/frontend_smoke.cjs

  firmware:
    name: Build verified basic firmware
    needs: [test, firefox]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install image tools
        run: sudo apt-get update && sudo apt-get install -y squashfs-tools p7zip-full
      - name: Download and verify the public upstream base
        run: |
          mkdir -p stock
          curl --fail --location --retry 3 --output stock/upstream-v2.8.3.7z https://github.com/djGrrr/8311-was-110-firmware-builder/releases/download/v2.8.3/WAS-110_8311_firmware_mod_v2.8.3_basic.7z
          echo '5d72e7552e396127b59a548c6163113d088d545708aecb0fed38097b862288f8  stock/upstream-v2.8.3.7z' | sha256sum --check
          7z x -so stock/upstream-v2.8.3.7z local-upgrade.tar > stock/upstream-v2.8.3-local-upgrade.tar
      - name: Build and verify every rootfs file, mode and symlink
        run: sudo python3 tools/build_from_release.py --base stock/upstream-v2.8.3-local-upgrade.tar --output out/release
      - uses: actions/upload-artifact@v4
        with:
          name: WAS110-basic-${{ github.sha }}
          path: out/release/
          if-no-files-found: error
          retention-days: 30
