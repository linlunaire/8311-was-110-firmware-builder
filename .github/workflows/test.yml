name: Offline regression tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      matrix:
        shell: [sh, busybox]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install test tools
        run: sudo apt-get update && sudo apt-get install -y lua5.1 pcre2-utils busybox shellcheck
      - name: Check shell syntax
        run: |
          bash -n build.sh
          shellcheck --severity=error build.sh extract.sh files/common/usr/sbin/8311-firmware-upgrade.sh files/common/usr/sbin/8311-vlansd.sh files/common/usr/sbin/8311-support.sh files/common/usr/sbin/8311-rx_los.sh files/common/usr/sbin/fwenv_set files/common/usr/sbin/fwenv_get
      - name: Run isolated device and LuCI regressions
        env:
          TEST_SHELL: ${{ matrix.shell }}
          TEST_SHELL_ARGS: ${{ matrix.shell == 'busybox' && 'sh' || '' }}
        run: python3 -m unittest discover -s tests -v
      - name: Check PON status polling
        run: node tests/status_poll_smoke.cjs
